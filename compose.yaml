services:
  dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    init: true
    user: "1000:1000"
    working_dir: /workspace
    command: pnpm dev
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - .env.local
    environment:
      BASE_URL: https://rowz-dev.zane.cloud
      DEV_PORT: "5777"
      DEV_HTTPS: "false"
      API_SERVER: http://127.0.0.1:3000
      PORT: "3000"
      DATABASE_URL: /workspace/apps/server/.data/pglite
    ports:
      # have to bind to 172.17.0.1 to enable Caddy proxying. see
      # docs/proxying-host-services.md in homelab project.
      - "0.0.0.0:5777:5777"
    volumes:
      - .:/workspace
      # Container dependencies stay separate from the host's installation.
      - /workspace/node_modules
      - /workspace/apps/server/node_modules
      - /workspace/apps/web/node_modules
      - /workspace/packages/engine/node_modules
      - /workspace/packages/shared/node_modules
      # Bind the existing database; do not create a new database volume.
      - type: bind
        source: ./apps/server/.data
        target: /workspace/apps/server/.data
        bind:
          create_host_path: false

  # A Postgres server for running the server tests as CI does: `pnpm test:postgres`.
  # Each test file creates and drops its own database, so nothing here needs to
  # outlive the container, and the data sits in memory.
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      # Not 5432, which a Postgres installed on the machine would already hold.
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 15

  # A Playwright server, for running the end-to-end tests where Chromium cannot
  # start, such as the Claude Code sandbox: `pnpm e2e:remote` (`e2e/remote.ts`).
  # The tests and the servers they start stay on the machine that runs them;
  # only the browser runs here.
  playwright:
    # The image and the server must match the version of @playwright/test in
    # pnpm-lock.yaml: a client refuses a server of another minor version.
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    command: npx --yes playwright@1.63.0 run-server --port 3000 --host 0.0.0.0
    working_dir: /home/pwuser
    # Not root, so that Chromium keeps its own sandbox.
    user: pwuser
    # Reaps the browser processes that the server leaves behind.
    init: true
    # Chromium runs out of memory in Docker's default 64 MB /dev/shm.
    ipc: host
    ports:
      # Not 3000, which the API server of `pnpm dev` holds. `e2e/remote.ts`
      # names this port too.
      - "127.0.0.1:3200:3000"
